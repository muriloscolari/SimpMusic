name: Build & Release Custom (Android, Linux AppImage, Windows)

on:
  push:
    branches:
      - 'custom'
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'GEMINI.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Configure local build properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./local.properties
          echo "isFullBuild=true" >> ./gradle.properties
          if [ -n "$LASTFM_API_KEY" ]; then
            echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> ./local.properties
          fi
          if [ -n "$LASTFM_SECRET" ]; then
            echo "LASTFM_SECRET=$LASTFM_SECRET" >> ./local.properties
          fi

      - name: Export library definitions
        run: ./gradlew exportLibraryDefinitions --no-configuration-cache

      - name: Build Android Release APKs
        run: ./gradlew :androidApp:assembleRelease --no-configuration-cache

      - name: Stage Android APKs
        id: stage_apks
        run: |
          set -euo pipefail
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p staging_android
          for apk in androidApp/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" .apk)
            arch=${base#androidApp-}
            arch=${arch%-release}
            cp "$apk" "staging_android/SimpMusic-v${VERSION}-${arch}.apk"
          done
          ls -lh staging_android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: staging_android/*
          compression-level: 0
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (Linux AppImage & Windows MSIX)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 zip || sudo apt-get install -y libfuse2 zip

      - name: Configure local build properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./local.properties
          echo "isFullBuild=true" >> ./gradle.properties
          if [ -n "$LASTFM_API_KEY" ]; then
            echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> ./local.properties
          fi
          if [ -n "$LASTFM_SECRET" ]; then
            echo "LASTFM_SECRET=$LASTFM_SECRET" >> ./local.properties
          fi

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Export library definitions
        run: ./gradlew exportLibraryDefinitions --no-configuration-cache

      - name: Prepare Desktop Build & Generate Conveyor Config
        run: ./gradlew :composeApp:mpvSetupAll :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Run Conveyor (Linux App)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: -Kapp.machines=linux.amd64.glibc make linux-app
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY || 'loud apology vital team rent champion better pluck cargo love knee tornado tomato man mammal lake sick possible ozone giggle suggest sail aunt multiply/2022-08-09T12:07:08Z' }}

      - name: Package Linux AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (Windows MSIX)
        uses: hydraulic-software/conveyor/actions/build@v22.0
        with:
          command: '-Kapp.machines=[windows.amd64] make site'
          agree_to_license: 1
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY || 'loud apology vital team rent champion better pluck cargo love knee tornado tomato man mammal lake sick possible ozone giggle suggest sail aunt multiply/2022-08-09T12:07:08Z' }}

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No simpmusic-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/"
          cp "$msix"                      "$stage/"
          if [ -f output/simpmusic.appinstaller ]; then
            cp output/simpmusic.appinstaller "$stage/"
          fi
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
            * )
          rm -rf "$stage"

      - name: Stage Desktop Assets
        id: stage_desktop
        run: |
          set -euo pipefail
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          mkdir -p staging_desktop

          # Linux AppImage
          appimage=$(ls desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
            cp "$appimage" staging_desktop/SimpMusic-v${VERSION}-Linux-x86_64.AppImage
          fi
          zsync=$(ls desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage.zsync 2>/dev/null | head -1)
          if [ -n "$zsync" ]; then
            cp "$zsync" staging_desktop/SimpMusic-v${VERSION}-Linux-x86_64.AppImage.zsync
          fi

          # Windows offline installer zip and MSIX / appinstaller
          if [ -f installers/SimpMusic-Windows-installer.zip ]; then
            cp installers/SimpMusic-Windows-installer.zip staging_desktop/SimpMusic-v${VERSION}-Windows-x64-installer.zip
          fi
          if [ -f output/simpmusic.appinstaller ]; then
            cp output/simpmusic.appinstaller staging_desktop/simpmusic.appinstaller
          fi
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -n "$msix" ]; then
            cp "$msix" staging_desktop/
          fi

          ls -lh staging_desktop/

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-assets
          path: staging_desktop/*
          compression-level: 0
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release_assets

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-assets
          path: release_assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${VERSION}"
          TITLE="v${VERSION}"
          COMMIT_SUBJECT=$(git log -1 --format="%s")
          COMMIT_BODY=$(git log -1 --format="%b")

          echo "Assets gathered for release $TAG:"
          ls -lh release_assets/

          cat << EOF > release_notes.md
          Release **v${VERSION}** (commit [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${SHORT_SHA})).

          ### 📝 Alterações:
          **${COMMIT_SUBJECT}**

          EOF

          if [ -n "$COMMIT_BODY" ]; then
            cat << EOF >> release_notes.md
          \`\`\`
          ${COMMIT_BODY}
          \`\`\`

          EOF
          fi

          cat << EOF >> release_notes.md
          ### 📦 Arquivos incluídos:
          - **Android (ARM64)**: \`SimpMusic-v${VERSION}-arm64-v8a.apk\` (recomendado para celulares modernos)
          - **Android (Universal)**: \`SimpMusic-v${VERSION}-universal.apk\` (compatível com qualquer arquitetura)
          - **Linux (AppImage)**: \`SimpMusic-v${VERSION}-Linux-x86_64.AppImage\` (executável direto no Linux)
          - **Windows (Instalador)**: \`SimpMusic-v${VERSION}-Windows-x64-installer.zip\` (extraia o ZIP e execute install.bat)
          EOF

          echo "Publishing release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Recreating release and moving tag to $SHORT_SHA..."
            gh release delete "$TAG" --cleanup-tag -y
          fi

          gh release create "$TAG" release_assets/* \
            --target "$SHORT_SHA" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --latest=true \
            --prerelease=false
