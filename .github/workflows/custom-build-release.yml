name: Build & Release Custom (Android, Linux AppImage, Windows)

on:
  push:
    branches:
      - 'custom'
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.github/**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build All Platforms & Publish Release
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 zip

      - name: Configure local build properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./local.properties
          echo "isFullBuild=true" >> ./gradle.properties

      - name: Export library definitions
        run: ./gradlew exportLibraryDefinitions --no-configuration-cache

      - name: Build Android Release APKs
        run: ./gradlew :androidApp:assembleRelease --no-configuration-cache

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for desktop
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Install Conveyor & Configure Signing Key
        env:
          CONVEYOR_AGREE_TO_LICENSE: "1"
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
        run: |
          if [ ! -d ".conveyor/install/conveyor-22.0" ]; then
            wget -q https://downloads.hydraulic.dev/conveyor/conveyor-22.0-linux-amd64.tar.gz
            mkdir -p .conveyor/install
            tar xzf conveyor-22.0-linux-amd64.tar.gz -C .conveyor/install
          fi
          echo "$PWD/.conveyor/install/conveyor-22.0/bin" >> "$GITHUB_PATH"
          if [ -z "$CONVEYOR_SIGNING_KEY" ]; then
            export CONVEYOR_PASSPHRASE="simpmusic-custom-build"
            "$PWD/.conveyor/install/conveyor-22.0/bin/conveyor" --passphrase=env:CONVEYOR_PASSPHRASE keys generate
          fi

      - name: Run Conveyor (Linux App)
        env:
          CONVEYOR_AGREE_TO_LICENSE: "1"
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_PASSPHRASE: "simpmusic-custom-build"
        run: |
          if [ -n "$CONVEYOR_SIGNING_KEY" ]; then
            conveyor --cache-dir=".conveyor/cache" "-Kapp.signing-key=$CONVEYOR_SIGNING_KEY" -Kapp.machines=linux.amd64.glibc make linux-app
          else
            conveyor --cache-dir=".conveyor/cache" --passphrase=env:CONVEYOR_PASSPHRASE -Kapp.machines=linux.amd64.glibc make linux-app
          fi

      - name: Package Linux AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Run Conveyor (Windows MSIX)
        env:
          CONVEYOR_AGREE_TO_LICENSE: "1"
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_PASSPHRASE: "simpmusic-custom-build"
        run: |
          if [ -n "$CONVEYOR_SIGNING_KEY" ]; then
            conveyor --cache-dir=".conveyor/cache" "-Kapp.signing-key=$CONVEYOR_SIGNING_KEY" '-Kapp.machines=[windows.amd64]' make site
          else
            conveyor --cache-dir=".conveyor/cache" --passphrase=env:CONVEYOR_PASSPHRASE '-Kapp.machines=[windows.amd64]' make site
          fi

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No simpmusic-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/"
          cp "$msix"                      "$stage/"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
            install.bat simpmusic.crt "$(basename "$msix")" )
          rm -rf "$stage"

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          set -euo pipefail
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          mkdir -p release_assets

          # Android APKs
          for apk in androidApp/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            base=$(basename "$apk" .apk)
            arch=${base#androidApp-}
            arch=${arch%-release}
            cp "$apk" "release_assets/SimpMusic-v${VERSION}-${arch}.apk"
          done

          # Linux AppImage
          appimage=$(ls desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage 2>/dev/null | head -1)
          if [ -n "$appimage" ]; then
            cp "$appimage" release_assets/SimpMusic-v${VERSION}-Linux-x86_64.AppImage
          fi

          # Windows offline installer zip
          if [ -f installers/SimpMusic-Windows-installer.zip ]; then
            cp installers/SimpMusic-Windows-installer.zip release_assets/SimpMusic-v${VERSION}-Windows-x64-installer.zip
          fi

          echo "Assets staged for release:"
          ls -lh release_assets/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare_assets.outputs.version }}
          SHORT_SHA: ${{ steps.prepare_assets.outputs.short_sha }}
        run: |
          TAG="custom-v${VERSION}-${SHORT_SHA}"
          TITLE="SimpMusic v${VERSION} (${SHORT_SHA})"

          cat << EOF > release_notes.md
          Automated build for branch **custom** at commit \`${SHORT_SHA}\`.

          ### Arquivos incluídos:
          - **Android (ARM64)**: \`SimpMusic-v${VERSION}-arm64-v8a.apk\` (recomendado para celulares modernos)
          - **Android (Universal)**: \`SimpMusic-v${VERSION}-universal.apk\` (compatível com qualquer arquitetura)
          - **Linux (AppImage)**: \`SimpMusic-v${VERSION}-Linux-x86_64.AppImage\` (executável direto no Linux)
          - **Windows (Instalador)**: \`SimpMusic-v${VERSION}-Windows-x64-installer.zip\` (extraia o ZIP e execute install.bat)
          EOF

          echo "Publishing release $TAG..."
          gh release create "$TAG" release_assets/* \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --prerelease=false
